"散步经过一块公共空地，你希望那里变成？|E 能随时遇见演出的小广场|G 有树荫和长椅的社区花园|B 可以召集居民讨论与发起活动的空间|D 邻里能交换闲置用品和互相帮忙的角落",
"给陌生城市的一天定个小主题，你选？|F 完成一条从出发前就看好的路线|A 带着地图看看这座城市怎么连在一起|C 看看当地人怎么写字、做器物或装饰店面|E 用一天收集七个计划外的发现",
"你要办一场只有几位熟人的小聚，愿意负责？|G 找个安静、坐久也舒服的地方|B 敲定时间地点，发出简单明确的邀请|D 留意谁不方便过来，帮忙一起想办法|F 把答应准备的食物和物件按时带齐",
"如果留一个空抽屉给未来，你想放进去？|A 一张会随着现实慢慢调整的愿望地图|C 写给自己和重要之人的几封信|E 各处捡来的车票和小玩意|G 一段不必填满的留白",
"临时收到两张你不太熟悉的演出票，你会？|B 看一眼介绍，感兴趣就直接决定|D 问问最近需要散心的朋友愿不愿来|F 先确认能准时到场，答应了就按时去|A 查交通和散场时间，再看看能不能成行",
"你想为亲近的人准备一个惊喜，最可能选？|C 记下对方以前随口提到的心愿，悄悄实现|E 在散步路线上藏几个轻松好玩的线索|G 把繁忙的一天留出一顿安静的晚饭|B 主动兑现对方一直想试、却没下决心的事",
"亲密关系里，哪种小事最能给你安全感？|D 我遇到难处时对方肯来帮一把|F 平常的约定都被记得并照做|A 遇到变化能一起把新的安排说清楚|C 我说不出完整的话，对方也愿意等我讲完",
"如果一起写下未来一年的愿望，你最想写？|E 常留出时间走几条没有走过的路|G 有各自喜欢的生活，也常常一起吃饭|B 各自做成一件重要的事，并肩庆祝|D 谁需要帮忙时，都能放心开口"
];

const questions = raw.map((row, index) => {
 const [prompt, ...entries] = row.split("|");
 const options = entries.map(entry => ({ type: entry[0], label: entry.slice(2) }));
 // 轮换显示位置，避免同一个性格原型总在同一位置。
 const offset = (index + Math.floor(index / 7)) % options.length;
 return { prompt, options: options.slice(offset).concat(options.slice(0, offset)) };
});
const chapters = [[8, "日常习惯"], [15, "处事方式"], [22, "社交模式"], [30, "情绪反应"], [40, "兴趣偏好"]];
const types = Object.keys(results);
const opportunities = Object.fromEntries(types.map(type => [
 type, questions.filter(question => question.options.some(option => option.type === type)).length
]));

function score(choices) {
 if (choices.length !== questions.length) return null;
 const weights = Object.fromEntries(types.map(type => [type, 0]));
 const boosts = Object.fromEntries(types.map(type => [type, 0]));
 const chosenTypes = [];
 for (const [index, choice] of choices.entries()) {
  const option = questions[index].options[choice];
  if (!option) return null;
  weights[option.type]++;
  // 最后四题直接涉及陪伴方式，同分时优先参考这些答案。
  if (index >= questions.length - 4) boosts[option.type]++;
  chosenTypes.push(option.type);
 }
 const compare = (a, b) =>
  weights[b] * opportunities[a] - weights[a] * opportunities[b] ||
  boosts[b] - boosts[a] ||
  chosenTypes.lastIndexOf(b) - chosenTypes.lastIndexOf(a);
 return [...types].sort(compare)[0];
}

const byId = id => document.getElementById(id);
const home = byId("home");
const quiz = byId("quiz");
const result = byId("result");
const form = byId("form");
const next = byId("next");
const back = byId("back");
const questionHeading = byId("question");
const optionsBox = byId("options");
const progress = byId("progress");
let index = 0;
let answers = [];

function show(view) {
 for (const section of [home, quiz, result]) section.hidden = section !== view;
}
function focusHeading(heading) {
 window.scrollTo(0, 0);
 heading.focus({ preventScroll: true });
}
function updateProgress() {
 const answered = answers.filter(answer => answer !== undefined).length;
 progress.setAttribute("aria-valuenow", answered);
 progress.firstElementChild.style.width = (100 * answered / questions.length) + "%";
 byId("progress-text").textContent = "第 " + (index + 1) + " / " + questions.length + " 题";
}
function renderQuestion() {
 const question = questions[index];
 byId("chapter").textContent = chapters.find(([end]) => index < end)[1];
 questionHeading.textContent = question.prompt;
 optionsBox.replaceChildren(...question.options.map((option, choice) => {
  const label = document.createElement("label");
  label.className = "option";
  const input = document.createElement("input");
  input.type = "radio";
  input.name = "answer";
  input.value = choice;
  input.checked = answers[index] === choice;
  const description = document.createElement("span");
  description.textContent = option.label;
  label.append(input, description);
  return label;
 }));
 updateProgress();
 back.disabled = index === 0;
 next.disabled = answers[index] === undefined;
 next.textContent = index === questions.length - 1 ? "查看结果" : "下一题 →";
 form.classList.remove("enter");
 void form.offsetWidth;
 form.classList.add("enter");
 focusHeading(questionHeading);
}
function renderResult(type) {
 const [city, person, role, quote, traits, reason, strength, egg] = results[type];
 byId("city").textContent = city;
 byId("person").textContent = "恋人原型 · " + person + " / " + role;
 byId("quote").textContent = "「" + quote + "」";
 byId("traits").replaceChildren(...traits.map(trait => {
  const tag = document.createElement("span");
  tag.textContent = trait;
  return tag;
 }));
 byId("reason").textContent = reason;
 byId("strength").textContent = strength;
 byId("egg").textContent = egg;
 show(result);
 result.classList.add("enter");
 focusHeading(byId("city"));
}
progress.setAttribute("aria-valuemax", questions.length);
byId("start").addEventListener("click", () => {
 show(quiz);
 renderQuestion();
});
optionsBox.addEventListener("change", event => {
 if (event.target.name !== "answer") return;
 answers[index] = Number(event.target.value);
 next.disabled = false;
 updateProgress();
});
back.addEventListener("click", () => {
 if (index === 0) return;
 index--;
 renderQuestion();
});
form.addEventListener("submit", event => {
 event.preventDefault();
 if (answers[index] === undefined) return;
 if (index === questions.length - 1) {
  const type = score(answers);
  if (type) renderResult(type);
  return;
 }
 index++;
 renderQuestion();
});
byId("restart").addEventListener("click", () => {
 answers = [];
 index = 0;
 show(home);
 focusHeading(byId("home-title"));
});
</script>
