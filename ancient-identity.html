<body>
<div class="wrap">
<header><span><b aria-hidden="true">印</b>古代身份测试</span><span>趣味人格 · 40 题</span></header>
<main>
<section id="home" class="hero" aria-labelledby="title">
  <div class="intro">
    <p class="eyebrow">从今天的选择，认领古代的身份</p>
    <h1 id="title" tabindex="-1">你在古代<br>是什么身份</h1>
    <p>临时改计划、朋友来求助、闲下一个下午，你会怎么选？做完 40 道生活题，看看哪位古人最像你。</p>
    <button id="start" class="gold" type="button">开启测试 <span aria-hidden="true">→</span></button>
  </div>
  <div class="art" aria-hidden="true"><span>照见</span><i>古</i></div>
</section>
<section id="quiz" class="sheet" aria-labelledby="question" hidden>
  <div class="progress-head"><span id="topic"></span><strong id="count"></strong></div>
  <progress id="progress" max="40" value="0" aria-label="已作答题数"></progress>
  <form id="answer-form">
    <fieldset id="group"><legend id="question" tabindex="-1"></legend><div id="choices"></div></fieldset>
    <div class="controls"><button id="back" class="ghost" type="button">上一题</button><button id="next" type="submit" disabled>下一题</button></div>
  </form>
</section>
<section id="result" class="result" aria-labelledby="person" hidden>
  <article class="card">
    <div class="card-head"><span>你的古代身份</span><span class="badge" id="role"></span></div>
    <h2 id="person" tabindex="-1"></h2>
    <p id="quote" class="quote"></p><div class="traits" id="traits"></div>
    <div class="detail">
      <h3>为什么像你</h3><p id="reason"></p>
      <h3>隐藏优势</h3><p id="strength"></p>
      <h3>趣味彩蛋</h3><p id="easter"></p>
    </div>
    <p class="card-foot">《你在古代是什么身份》 · 趣味人格测试</p>
  </article>
  <div class="actions"><button id="capture" type="button" aria-pressed="false">截图模式</button><button id="restart" class="ghost" type="button">重新测试</button></div>
  <p id="hint" class="hint" hidden>用手机或电脑的截图功能，截取上方结果卡。</p>
</section>
</main>
<footer>结果为趣味角色类比，仅供娱乐，不作为心理评估。</footer>
</div>

const questions = chapters.flatMap(([topic, rows]) => rows.map(([title, ...entries], index) => {
  const options = entries.map(entry => {
    const [dimension, label] = entry.split("|");
    return { dimension, label };
  });
  const offset = (title.length + index) % options.length;
  return { topic, title, options: [...options.slice(offset), ...options.slice(0, offset)] };
}));

const dimensions = Object.keys(profiles);
const opportunities = Object.fromEntries(dimensions.map(key => [
  key, questions.filter(question => question.options.some(option => option.dimension === key)).length
]));

function scoreAnswers(selections) {
  const picked = questions.map((question, index) => question.options[selections[index]].dimension);
  const votes = Object.fromEntries(dimensions.map(key => [key, 0]));
  for (const key of picked) votes[key] += 1;

  // 维度得分 = 选中次数 / 出现题数。交叉相乘比较，避免浮点误差。
  // 同分时取最近一次选中的同分维度，保证同一组答案结果稳定。
  return [...new Set(picked.slice().reverse())].reduce((best, key) => {
    return votes[key] * opportunities[best] > votes[best] * opportunities[key] ? key : best;
  });
}

const byId = id => document.getElementById(id);
const form = byId("answer-form");
const choiceList = byId("choices");
let answers = [];
let current = 0;

function setScreen(screen, heading) {
  for (const id of ["home", "quiz", "result"]) byId(id).hidden = id !== screen;
  byId(heading).focus({ preventScroll: true });
  window.scrollTo(0, 0);
}

function setCapture(enabled) {
  document.body.classList.toggle("capture", enabled);
  byId("capture").setAttribute("aria-pressed", String(enabled));
  byId("capture").textContent = enabled ? "退出截图模式" : "截图模式";
  byId("hint").hidden = !enabled;
  if (enabled) window.scrollTo(0, 0);
}

function renderQuestion() {
  const question = questions[current];
  byId("topic").textContent = question.topic;
  byId("count").textContent = (current + 1) + " / " + questions.length;
  byId("progress").value = answers.filter(Number.isInteger).length;
  byId("question").textContent = question.title;
  choiceList.replaceChildren();

  question.options.forEach((option, index) => {
    const label = document.createElement("label");
    const input = document.createElement("input");
    const line = document.createElement("span");
    const letter = document.createElement("b");
    label.className = "choice";
    input.type = "radio";
    input.name = "answer";
    input.value = index;
    input.checked = answers[current] === index;
    letter.textContent = String.fromCharCode(65 + index);
    letter.setAttribute("aria-hidden", "true");
    line.append(letter, document.createTextNode(option.label));
    label.append(input, line);
    choiceList.append(label);
  });

  byId("back").disabled = current === 0;
  byId("next").disabled = !Number.isInteger(answers[current]);
  byId("next").textContent = current === questions.length - 1 ? "查看结果" : "下一题";
  const group = byId("group");
  group.classList.remove("enter");
  void group.offsetWidth;
  group.classList.add("enter");
  setScreen("quiz", "question");
}

function renderResult() {
  const profile = profiles[scoreAnswers(answers)];
  ["role", "person", "quote", "traits", "reason", "strength", "easter"].forEach((id, index) => {
    byId(id).textContent = profile[index];
  });
  setScreen("result", "person");
}

byId("start").addEventListener("click", renderQuestion);
choiceList.addEventListener("change", event => {
  if (byId("quiz").hidden || event.target.name !== "answer") return;
  answers[current] = Number(event.target.value);
  byId("progress").value = answers.filter(Number.isInteger).length;
  byId("next").disabled = false;
});
form.addEventListener("submit", event => {
  event.preventDefault();
  if (byId("quiz").hidden || !Number.isInteger(answers[current])) return;
  if (current === questions.length - 1) renderResult();
  else {
    current += 1;
    renderQuestion();
  }
});
byId("back").addEventListener("click", () => {
  if (current === 0) return;
  current -= 1;
  renderQuestion();
});
byId("capture").addEventListener("click", () => {
  setCapture(!document.body.classList.contains("capture"));
});
byId("restart").addEventListener("click", () => {
  answers = [];
  current = 0;
  setCapture(false);
  setScreen("home", "title");
});
</script>
